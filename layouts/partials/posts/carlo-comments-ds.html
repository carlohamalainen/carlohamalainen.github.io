<!-- https://developers.cloudflare.com/turnstile/get-started/client-side-rendering/#explicit-rendering -->
<script src= "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer type="text/javascript"> </script>

<script type="module" src= "https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.2/bundles/datastar.js"> </script>

<style>
  #comments { margin: 2rem 0; }

  /* Each comment separated by a rule + spacing → clear start/end */
  .comment {
    padding: 1rem 0;
    border-top: 1px solid rgba(128, 128, 128, .3);
  }
  .comment:first-of-type { border-top: none; }

  /* The "who + when" line: author bold, date muted */
  .comment header { margin-bottom: .35rem; }
  .comment-author { font-weight: 700; }
  .comment header time {
    margin-left: .5rem;
    font-size: .85em;
    opacity: .65;
  }

  /* Body: tidy paragraph spacing */
  .comment-body { line-height: 1.6; }
  .comment-body :first-child { margin-top: 0; }
  .comment-body :last-child { margin-bottom: 0; }

  /* Comments often contain code (fenced + inline) */
  .comment-body pre {
    background: rgba(128, 128, 128, .12);
    padding: .75rem 1rem;
    border-radius: 4px;
    overflow-x: auto;            /* don't let long lines blow out the layout */
  }
  .comment-body code {
    background: rgba(128, 128, 128, .12);
    padding: .1rem .3rem;
    border-radius: 3px;
  }
  .comment-body pre code { background: none; padding: 0; }

  #comment-status { margin-top: .75rem; font-weight: 600; }
</style>

<section id="comments"
         data-on-intersect="@get('https://comments.carlo-hamalainen.net/comments/v1/list?postID={{ strings.TrimSuffix "/" .RelPermalink }}')">
  <p>Loading comments…</p>
</section>


<div data-signals="{widgetId: '', turnstileToken: '' }">

  <div id="turnstile-container" data-on-interval__duration.250ms=
    "if (window.turnstile && !$widgetId) { 
      $widgetId = turnstile.render('#turnstile-container', 
        { sitekey: '0x4AAAAAAAfct15KixMdrAXv', 
          callback: (token) => $turnstileToken = token 
        }); }"
  >
  </div>

  <p data-show="$turnstileToken === ''">Comment form pending Cloudflare verification...</p>

  <form id="myform" data-show="$turnstileToken" style= "display: none" name="myform">
    <input type="hidden" name="cf-turnstile-response" data-bind= "turnstileToken">
    <input type="hidden" name="postID" value="{{ strings.TrimSuffix "/" .RelPermalink }}">


    <p><label for="name">Name (required):</label><br>
    <input type="text" id="name" name="name" required=""></p>

    <p><label for="email">Email (optional):</label><br>
    <input type="email" id="email" name="email"></p>

    <p><label for="comment">Comment:</label><br>
    <textarea id="comment" name="comment" rows="8" cols="50" required="">
    </textarea></p>


    <button type="button"
      data-on:click="@post('https://comments.carlo-hamalainen.net/comments/v1/new', {contentType: 'form'})"
      >
      Submit comment</button>

     <div id="comment-status"></div>

</div>
